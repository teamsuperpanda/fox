name: CI

on:
  pull_request:
    branches: ['main', 'v3']
    types: [opened, synchronize, reopened]
  push:
    branches: ['main', 'v3']

# Cancel superseded runs on the same ref (a re-run of the same commit wins).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned on purpose: a Flutter upgrade is a deliberate PR, not an ambient change.
  FLUTTER_VERSION: '3.47.6'

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Pub
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      # The generated l10n files are formatter output, not contributor code.
      - name: Format generated localization
        run: dart format lib/l10n

      # This is the real gate: it fails instead of rewriting the tree, so an
      # unformatted file cannot slip through.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run flutter analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage --exclude-tags golden
